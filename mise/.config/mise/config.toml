[settings]
experimental = true
idiomatic_version_file_enable_tools = [
  # "java", -- handled by twiddling env flags for jenv
  "go",
  "node",
  "python",
  "ruby",
  "rust",
  # "swift",
]
jobs = 12

[settings.python]
compile = false

[tools]
"gem:gem-ctags" = "latest"
"gem:git-bump" = "latest"
node = "latest"
bun = "latest"
ruby = "3.4.4"

[tasks.brew-update]
description = "Update Homebrew if not updated recently"
hide = true
quiet = true
run = """
if [ $(($(date +%s) - $(stat -c %Y "$(brew --repository)/.git/FETCH_HEAD" 2>/dev/null || echo 0))) \
  -lt ${HOMEBREW_AUTO_UPDATE_SECS:-86400} ]; then
  exit 0
fi
brew update --quiet --auto-update
"""

[tasks.brew-upgrade]
description = "Interactively upgrade non-dependency Homebrew packages"
depends = ["brew-update"]
raw = true
quiet = true
tools = { fzf = "latest" }
run = """
#!/usr/bin/env zsh
comm -12 \
    <((brew leaves; brew casks) | sort) \
    <(brew outdated | awk '{print $1}' | sort) \
  | fzf \
    --multi \
    --prompt="Select packages to upgrade (TAB to select, ENTER to confirm): " \
  | xargs -r brew upgrade
"""

[tasks.docs]
description="List doc/ files with title and description from frontmatter"
quiet = true
run = """
#!/usr/bin/env zsh
local lines=()
for file in ./doc/**/*.md(N); do
  desc=$(rg --max-count 1 '^desc:' "$file" | sed 's/^desc: *//; s/^"//; s/"$//')
  lines+=("$file  $desc")
done

if [[ -n "$CLAUDECODE" ]]; then
  docs=$(printf '%s\n' "${lines[@]}")
  jq --null-input --arg docs "$docs" \
    '{hookSpecificOutput: {hookEventName: "SessionStart", additionalContext: ("Available project documentation (read relevant docs before unfamiliar work):\n" + $docs)}}'
else
  printf '%s\n' "${lines[@]}"
fi
"""


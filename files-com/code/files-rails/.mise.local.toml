[[env]]
GEM_HOME = "{{config_root}}/.gem/ruby/{{exec(command='cat .ruby-version')}}"
GEM_PATH = "{{env.GEM_HOME}}"

[[env]]
_.path = "{{env.GEM_HOME}}/bin"

[hooks]
enter = [
  "[ -d \"$GEM_HOME\" ] || mkdir -p \"$GEM_HOME\"",
]

[tasks.overmind]
description = "Run files.com stack from Procfile with Overmind"
run = [
  "overmind start",
  "sleep 0.5",
  "overmind connect",
]

[tasks.overmind.env]
OVERMIND_SHELL = "zsh"
OVERMIND_TITLE = "files-com"
OVERMIND_SHOW_TIMESTAMPS = "true"
OVERMIND_AUTO_RESTART = "all"
OVERMIND_DAEMONIZE = "true"
OVERMIND_TMUX_CONFIG = ""

[tasks.server]
depends = ["server:web", "server:worker", "//../files-react:server"]

[tasks."server:web"]
env = { RAILS_ENV = "development" }
run = "bundle exec rails server -p 3000"

[tasks."server:worker"]
env = { RAILS_ENV = "development", WORKER_COUNT = 4, SCHEDULER = true, QUEUE_PREFIX = "*" }
run = "rake resque:work"

[tasks.ruby-lsp]
run = "ruby-lsp"

[tasks.ruby-lsp.env]
BUNDLE_GEMFILE = "./gems_ruby_lsp.rb"
GEM_HOME = "{{config_root}}/.ruby-lsp/.gem/ruby/{{exec(command='cat .ruby-version')}}"
GEM_PATH = "{{env.GEM_HOME}}:{{config_root}}/.gem/ruby/{{exec(command='cat .ruby-version')}}"

[tasks.install]
description = "Install Ruby gem dependencies"
run = "bundle install"
sources = ["Gemfile", "Gemfile.lock"]
outputs = { auto = true }

[tasks."lint:rubocop"]
description = "Run RuboCop linter with auto-correction"
run = "bundle exec rubocop --autocorrect --format=quiet --parallel"
depends = ["install"]
sources = ["**/*.rb", ".rubocop.yml"]
outputs = { auto = true }

[tasks.lint]
description = "Run all linters"
depends = ["lint:rubocop"]

[tools]
"gem:debug" = "latest"
"gem:ruby-debug-ide" = "latest"
"gem:typeprof" = "latest"
"gem:test_file_finder" = "latest"
"github:spinel-coop/rv" = "latest"
"pipx:pynvim" = "latest"
python = "latest"
